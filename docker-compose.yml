services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ws-server-1:
    build:
      context: .
      dockerfile: ws-server/Dockerfile
    environment:
      - SERVER_PORT=8080
      - SERVER_ID=ws-server-1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  ws-server-2:
    build:
      context: .
      dockerfile: ws-server/Dockerfile
    environment:
      - SERVER_PORT=8080
      - SERVER_ID=ws-server-2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  ws-server-3:
    build:
      context: .
      dockerfile: ws-server/Dockerfile
