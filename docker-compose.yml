services:
  ws-server:
    build:
      context: .
      dockerfile: ws-server/Dockerfile
    ports:
      - "8080:8080"

  ws-client:
    build:
      context: .
      dockerfile: ws-client/Dockerfile
    depends_on:
      - ws-server

# Add infra dependencies (redis, kafka, postgres, ...) here as extra services
