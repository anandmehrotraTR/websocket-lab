spring.application.name=ws-server
server.port=${SERVER_PORT:8080}
server.id=${SERVER_ID:ws-server-local}

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Rate Limiter configuration
websocket.rate-limiter.enabled=${WS_RATE_LIMITER_ENABLED:false}
websocket.rate-limiter.max-connections=${WS_RATE_LIMITER_MAX:10000}
websocket.rate-limiter.window-size-ms=${WS_RATE_LIMITER_WINDOW_MS:1000}

# Logging
logging.level.com.websocketlab.server=INFO
